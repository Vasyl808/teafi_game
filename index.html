<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tea-Fi Game</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="floating-tea" style="top: 10%; left: 10%;">🫖</div>
    <div class="floating-tea" style="top: 20%; right: 15%; animation-delay: -2s;">☕</div>
    <div class="floating-tea" style="bottom: 30%; left: 20%; animation-delay: -1s;">🍃</div>
    <div class="floating-tea" style="bottom: 10%; right: 10%; animation-delay: -3s;">🫖</div>
    
    <div class="game-container">
        <canvas id="gameCanvas" class="game-canvas"></canvas>
        
        <div class="ui-overlay">
            <div class="top-hud">
                <div class="score-panel">
                    <span class="tea-emoji">☕</span>
                    <span>Score: <span id="currentScore">0</span></span>
                </div>
                <div class="tokens-panel">
                    <span>🍃</span>
                    <span>Tea leaves: <span id="tokenCount">0</span></span>
                </div>
            </div>
            
            <div class="high-score">
                Best: <span id="highScore">0</span>
            </div>
            
            <div id="startScreen" class="start-screen">
                <div class="logo-container">
                    <img src="tea_logo.png" alt="Tea-Fi Logo" class="teafi-logo" />
                </div>
                <div class="brand-title">Tea-Fi</div>
                <div class="game-title">Tea-Fi Jump</div>
                <p class="description">
                    Help the tea cup climb up!<br>
                    Collect tea leaves and avoid falling!
                </p>
                <button id="startBtn" class="btn">Start Brewing ☕</button>
                <div class="controls">
                    Controls: ← → Arrow keys or A/D<br>
                    Mobile: Touch buttons below
                </div>
            </div>
            
            <div id="gameOver" class="game-end">
                <div class="game-title">Tea Time Over!</div>
                <div class="stats">
                    <div>Score: <span id="finalScore">0</span></div>
                </div>
                <div class="stats">
                    <div>Tokens: <span id="finalTokens">0</span></div>
                </div>
                <div id="newRecord" class="new-record">🎉 New High Score!</div>
                <button id="restartBtn" class="btn">Brew Again ☕</button>
                <button id="homeBtn" class="btn-home">Home</button> 
            </div>
            
            <div class="mobile-controls">
                <button class="mobile-btn" id="leftBtn">←</button>
                <button class="mobile-btn" id="rightBtn">→</button>
            </div>
        </div>
    </div>

    <script src="game.js" defer></script>
</body>
</html>
